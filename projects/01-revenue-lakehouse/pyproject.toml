[project]
name = "revenue-lakehouse"
version = "0.1.0"
description = "Medallion lakehouse that turns hotel reservation events into trusted revenue KPIs"
requires-python = ">=3.12"
dependencies = [
    "deltalake>=1.0",
    "duckdb>=1.4",
    "pyarrow>=20",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revenue_lakehouse"]
