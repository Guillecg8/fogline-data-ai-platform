[project]
name = "ops-copilot"
version = "0.1.0"
description = "RAG + MCP copilot over Fogline's operational documents and KPIs"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0",
    "duckdb>=1.1",
    "httpx>=0.27",
    "mcp>=2,<3",
    "pydantic>=2.7",
    "pyyaml>=6",
    "rank-bm25>=0.2.2",
    "truststore>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_copilot"]
