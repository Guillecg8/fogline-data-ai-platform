[project]
name = "ops-copilot"
version = "0.1.0"
description = "RAG + MCP copilot over Fogline's operational documents and KPIs"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_copilot"]
