[project]
name = "commerce-gateway"
version = "0.1.0"
description = "Agent-facing commerce gateway with spend limits, human approval and an audit trail"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commerce_gateway"]
